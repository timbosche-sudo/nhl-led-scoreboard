name: Test, build & deploy to GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit & layout tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # Optional: set a repository variable NHL_PROXY_URL (Settings → Secrets and variables →
          # Actions → Variables) to your Cloudflare Worker URL so live data works out of the box.
          VITE_NHL_PROXY_URL: ${{ vars.NHL_PROXY_URL }}
      - name: Smoke-test the production build with the Node server
        run: |
          PORT=8080 node server/server.mjs &
          sleep 1
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: test-and-build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
